        const player = document.getElementById("audioPlayer");
        const nowPlaying = document.getElementById("nowPlaying");

        function playRandomSong() {
            let randomIndex = Math.floor(Math.random() * soundFiles.length);
            let selectedSong = soundFiles[randomIndex];
            player.src = selectedSong;
            player.play().catch(error => console.log("Playback prevented:", error));
            
            let fileName = selectedSong.split("/").pop().split("?")[0];
            nowPlaying.innerText = "Now Playing: " + decodeURIComponent(fileName);
        }

        player.addEventListener("ended", playRandomSong);
        playRandomSong();
    </script>
